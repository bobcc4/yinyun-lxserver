services:
  yinyun:
    image: bobcc4/yinyun-lxserver:latest
    container_name: yinyun
    restart: unless-stopped
    ports:
      - "9527:9527"
    volumes:
      - ./data:/server/data
      - ./logs:/server/logs
      - ./cache:/server/cache
      - ./music:/server/music
      # Configure the library name in the admin console before enabling this mount.
      # - /volume1/media/music:/server/external/admin/bendigequ:ro
    environment:
      - NODE_ENV=production
      - CONFIG_PATH=/server/data/config.js
