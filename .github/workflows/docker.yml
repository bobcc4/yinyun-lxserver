name: Build and Push Docker Image

on:
  workflow_call:
    inputs:
      version:
        required: false
        type: string
      cleanup_legacy_v1:
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      version:
        description: Optional image version (for example, v1.5.2)
        required: false
        type: string
      cleanup_legacy_v1:
        description: Remove the deprecated v1 tag without rebuilding
        required: false
        default: false
        type: boolean
env:
  REGISTRY: ghcr.io
  # 使用 github.repository_owner 获取用户名，并指定音云镜像名
  IMAGE_NAME: ${{ github.repository_owner }}/yinyun-lxserver
  # Docker Hub 仓库名
  DOCKER_HUB_REPO: ${{ secrets.DOCKER_USERNAME }}/yinyun-lxserver

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      # Add QEMU for multi-platform build
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Generate build hash
        if: inputs.cleanup_legacy_v1 != true
        run: node scripts/update-build-hash.js

      - name: Resolve image version
        if: inputs.cleanup_legacy_v1 != true
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="$GITHUB_REF_NAME"
          elif [[ -n "$INPUT_VERSION" ]]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="v$(node -p "require('./package.json').version")"
          fi

          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid image version: $VERSION"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then
            echo "stable=false" >> "$GITHUB_OUTPUT"
          else
            echo "stable=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract metadata (tags, labels) for Docker
        if: inputs.cleanup_legacy_v1 != true
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            ${{ env.DOCKER_HUB_REPO }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest,enable=${{ steps.version.outputs.stable == 'true' }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.title=Yinyun
            org.opencontainers.image.description=音云 Yinyun private music server and Web player
            org.opencontainers.image.licenses=Apache-2.0

      - name: Build and push Docker image
        if: inputs.cleanup_legacy_v1 != true
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          # Enable multi-platform build
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Remove deprecated v1 registry tags
        if: inputs.cleanup_legacy_v1 == true
        shell: bash
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TOKEN="$({
            jq -nc \
              --arg username "$DOCKER_USERNAME" \
              --arg password "$DOCKER_PASSWORD" \
              '{username: $username, password: $password}' |
              curl --fail --silent --show-error \
                --header 'Content-Type: application/json' \
                --data-binary @- \
                https://hub.docker.com/v2/users/login/
          } | jq -r '.token // empty')"

          if [[ -z "$TOKEN" ]]; then
            echo "Docker Hub did not return an API token"
            exit 1
          fi

          HTTP_STATUS="$(curl --silent --show-error \
            --output /dev/null \
            --write-out '%{http_code}' \
            --request DELETE \
            --header "Authorization: JWT $TOKEN" \
            "https://hub.docker.com/v2/repositories/$DOCKER_USERNAME/yinyun-lxserver/tags/v1/")"

          if [[ "$HTTP_STATUS" != "204" && "$HTTP_STATUS" != "404" ]]; then
            echo "Docker Hub tag deletion failed with HTTP $HTTP_STATUS"
            exit 1
          fi

          VERSION_ID="$(gh api \
            "/users/${{ github.repository_owner }}/packages/container/yinyun-lxserver/versions" \
            --jq '.[] | select(any(.metadata.container.tags[]?; . == "v1")) | .id' |
            head -n 1)"

          if [[ -n "$VERSION_ID" ]]; then
            gh api --method DELETE \
              "/users/${{ github.repository_owner }}/packages/container/yinyun-lxserver/versions/$VERSION_ID"
          fi
